behaviors:
  FlappyBirdBrain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048      # Aumentado para uso intenso da GPU
      buffer_size: 20480     # Aumentado para corresponder ao batch_size
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      dueling: true          # <<< ATIVANDO A ARQUITETURA DUELING

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 9000000
    time_horizon: 64
    summary_freq: 10000
    keep_checkpoints: 5